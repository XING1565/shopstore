[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shopstore-integration"
version = "0.1.0"
description = "ShopVidi Integration Layer - Woo/Odoo adapters, sync tasks, idempotency, unified HTTP client."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27,<0.28",
    "sqlalchemy>=2.0,<2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[tool.setuptools.packages.find]
where = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
