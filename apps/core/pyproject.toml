[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shopstore-core"
version = "0.1.0"
description = "Marketplace Core service (stage 0 skeleton)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi~=0.115.0",
    "uvicorn~=0.34.0",
    "sqlalchemy~=2.0.0",
    "alembic~=1.14.0",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "psycopg[binary]~=3.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest~=8.3.0",
    "httpx~=0.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
