[alembic]
script_location = migrations
path_separator = os

# Placeholder; the real connection URL is injected in env.py from app config (env vars).
sqlalchemy.url = postgresql+psycopg://core:change_me_in_env_file@127.0.0.1:5432/shopstore_core

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
